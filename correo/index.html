<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio</title>
    <style>
        body,
        table,
        td,
        a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        table,
        td {
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        img {
            -ms-interpolation-mode: bicubic;
            border: 0;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }

        table {
            border-collapse: collapse !important;
        }

        body {
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
        }

        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>

<body style="margin: 0; padding: 0; background-color: #fafafa;">

    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
        <tr>
            <td align="center" style="padding: 40px 10px;">

                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600"
                    style="max-width: 600px; width: 100%; background-color: #ffffff; border: 1px solid #eaeaea; border-radius: 8px; overflow: hidden;">

                    <tr>
                        <td align="center" style="padding: 0;">
                            <a href="https://delvicier.netlify.app/" target="_blank" style="display: block;">
                                <img src="https://i.pinimg.com/736x/cd/eb/5c/cdeb5c5456d2bed89a8f3520ffcdcb1e.jpg"
                                    alt="Vista Previa" width="600"
                                    style="display: block; width: 100%; max-width: 100%; height: auto; border-top-left-radius: 8px; border-top-right-radius: 8px;">
                            </a>
                        </td>
                    </tr>

                </table>
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                    <tr>
                        <td align="center"
                            style="padding-top: 20px; color: #888888; font-size: 12px; font-family: sans-serif;">
                            © Christopher Delvicier
                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</body>

</html>
